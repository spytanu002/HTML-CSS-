<style>

  .Stretch{
    background-color: green;
    border:none ;
    color: white;
    padding-left: 15px;
    padding-right: 15px;
    padding-top: 8px;
    padding-bottom: 8px;
    margin-right: 10px; 
    margin-left: 10px;
    font-size: 18px;
    cursor: pointer;
    transition: padding 0.15s,
    margin 0.15s ;
   }

  .Stretch:hover{
    padding-left: 25px;
    padding-right: 25px;
    margin-left: 0px;
    margin-right: 0px;
     

  }

</style>


<button class="Stretch">
  ONE
</button>

<button class="Stretch">
  TWO
</button>
<button class="Stretch">
  THREE
</button>

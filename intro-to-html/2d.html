  border-radius: 4px;
  font-weight: bold;
  font-size: 15px;

  margin-right: 8px;
}

.bootstrap-download {

  transition: 0.15s;

  color: 0.15s;
  border-color:  rgb(108, 117, 125) ;
}

.bootstrap-download:hover {
  background-color: rgb(118, 117, 125) ;

  border-color:  rgb(118, 117, 125);

}
.bootstrap-button:hover{

<!DOCTYPE html>
<html>
  <head>
    <tital>15e.html</tital>
    <style>
     body{
      height: 3000px;
      font-family: arial;
     }
     .product-cantainer{
      position:relative;
      display: inline-block;
     }
     .product-image{
      width: 300px;
      height: 300px;
      background-color: gray;
      object-fit: cover;
     }
     .promotion{
      position: absolute;
      background-color: black;
      color: white;
      top: 10px;
      right: 0px;
      padding: 10px;
     }
     .bottom-overlay{
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
     } 
     .add-to-card-button{
      background-color: white;
      border-width:1px;
      border-style: solid;
      border-color: black;
      padding: 12px;
     }   </style>
  </head>
  <body>
   
    <div class="product-image">
    <div class="promotion">20% OFF</div>
    <div class="bottom-overlay">
      <button class="add-to-card-button">
        Add to card
      </button>
      </div>
    
   </div>
  
  </body>
</html>

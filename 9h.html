<!DOCTYPE html>
<html>
  <head>
    <style>
    p{
      font-family:arial;
      margin-top:0px;
      margin-bottom:0px;
      

    }
    .card{
      width:200px;
      width:100%;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
      margin-top: 8px;
      margin-bottom: 8px;
      margin-left: 8px;
      margin-right: 8px;
     
    }
    .square-black{
      width: 200px;
      height:200px;
      width:100%;
      margin-bottom:12px;
      background-color: grey;
     
    }
    .oliver{
      font-size:18px;
      font-weight:bold;
      margin-left: 8px;
      margin-bottom:4px;
    } 
    .mutual{
      color: rgb(100, 100, 100);
      margin-left: 8px;
      margin-bottom:12px;

    }
    .add{
      background-color: rgb(24, 119,242);
      color:white;
      border:none;
      padding-top:10px;
      padding-bottom: 10px;
      padding-left:20px;
      padding-right:20px;
      border-radius:4px;
      font-size:16px;
      margin-left:8px;
      margin-bottom: 10px;

    }

  



.square-brown{
  width: 200px;
      height:200px;
      width:100%;
      margin-bottom:12px;
      background-color:brown;

}
.Mine{
  font-size:18px;
      font-weight:bold;
      margin-left: 8px;
      margin-bottom:4px;
}
.mutual-second{
  color: rgb(100, 100, 100);
      margin-left: 8px;
      margin-bottom:12px;

}
.square-yellow{
  width: 200px;
  height:200px;
  margin-bottom:12px;
  background-color: yellow;
  width: 100%;

}
.rex{
  font-size:18px;
      font-weight:bold;
      margin-left: 8px;
      margin-bottom:4px;
}
.mutual-therd{
  color: rgb(100, 100, 100);
      margin-left: 8px;
      margin-bottom:12px;
}
  
    </style>
  </head>
  <body>
    <div style=" 
    margin: 30px;
         display:grid;
    grid-template-columns: 1fr 1fr 1fr ;
    column-gap: 16px;
    row-gap:40px;
     align-items:center;
">
    <div class="card">
      <div class="square-black"></div>
      <p class="oliver">oliver</p>
      <p class="mutual">2 mutual friends</p>
      <button class="add">Add Friend</button>
    </div>
    <div class="card">
      <div class="square-brown"></div>
      <p class="Mine">Mini</p>
      <p class="mutual-second">3 mutual friends</p>
      <button class="add">Add Friend</button>
    </div>
    <div class="card">
      <div class="square-yellow"></div>
      <p class="rex">Rex</p>
      <p class="mutual-therd">4 mutual friends</p>
      <button class="add">Add Friend</button>
    </div>
    
    

    </div>

  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <style>
    p{
      font-family:arial;
      margin-top:0px;
      margin-bottom:0px;

    }
    .card{
      width:200px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
    }
    .square-black{
      width: 200px;
      height:200px;
      margin-bottom:12px;
      background-color: grey;
    }
    .oliver{
      font-size:18px;
      font-weight:bold;
      margin-left: 8px;
      margin-bottom:4px;
    } 
    .mutual{
      color: rgb(100, 100, 100);
      margin-left: 8px;
      margin-bottom:12px;

    }
    .add{
      background-color: rgb(24, 119,242);
      color:white;
      border:none;
      padding-top:10px;
      padding-bottom: 10px;
      padding-left:20px;
      padding-right:20px;
      border-radius:4px;
      font-size:16px;
      margin-left:8px;
      margin-bottom: 10px;

    }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="square-black"></div>
      <p class="oliver">oliver</p>
      <p class="mutual">2 mutual friends</p>
      <button class="add">Add Friend</button>
    </div>
  </body>
</html>

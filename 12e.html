<!DOCTYPE html>
<html>
  <head>
    <title>12e.html</title>
    <style>
      div{
        font-family: arial;
      }
    .cantainer{ 
      width: 300px;
     border-radius: 6px;
     border-style: solid;
     border-color: gray;
     border-width: 1px;
    }
     .flexbox{
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
     padding-top: 6px;
     padding-bottom: 6px;
     padding-right: 12px;
     padding-left: 12px;

         
     }
     .notification{
      background-color: rgb(43, 43, 250);
      color: white;
      padding-top: 4px;
      padding-bottom: 4px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 15px;
     }


    </style>
    <body>
      <div class="cantainer">

         <div class="flexbox">
          <div>Home</div>
         <div class="notification"> 14 </div>
         </div>
          <div class="flexbox">
            <div>Notifications</div>
            <div class="notification">3</div>
         </div>

         <div class="flexbox">
          <div>Messages</div>
          <div class="notification">5</div>
         </div>
    </div>
     </body>
  </head>
</html>

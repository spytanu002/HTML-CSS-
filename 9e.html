<!DOCTYPE html>
<html>
  <head>
    <style>
      .card{
        box-shadow: 0 0 6px rgba(0, 0, 0);
        padding-top: 12px;
        padding-left:12px;
        padding-right: 12px;
        padding-bottom: 12px;
        width:450px;
        border-radius: 6px;

      }
      .circle-grey{
        width: 50px;
        height:50px;
        background-color: grey;
        border-radius:50px;
        object-fit: cover;
        vertical-align: middle;
        margin-right: 5px;
        display: inline-block;
        
      }
    .text-box{
      font-size: 18px;
      border:none;
      width:300px;
      vertical-align: middle;
    }

    .tweet-button{
      background-color: rgb(29, 155, 240);
      color :white;
      padding-top: 8px;
      padding-bottom:8px;
      padding-right:16px;
      padding-left:16px;
      border-radius:30px;
      font-size:16px;
      font-weight: bold;
      vertical-align:middle;
      border:none;
    }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="circle-grey"></div>
      <input type="text" class="text-box" placeholder="what's happening">
      <button class="tweet-button" >tweet</button>

    </div>
  </body>
</html>
